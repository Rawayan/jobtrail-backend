services:
  - type: web
    name: jobtrail-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi --log-file -"
    envVars:
      - key: DEBUG
        value: "False"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ayan-jobtrail-frontend.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: PYTHON_VERSION
        value: "3.13.9"
